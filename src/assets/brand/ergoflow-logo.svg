<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">ErgoFlow primary logo</title>
  <desc id="desc">General ErgoFlow brand logo with a flowing EF monogram and horizontal wordmark, designed as the umbrella identity for multiple ErgoFlow apps.</desc>
  <defs>
    <linearGradient id="ergoflow-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A4D78"/>
      <stop offset="0.55" stop-color="#083A66"/>
      <stop offset="1" stop-color="#061D3B"/>
    </linearGradient>
    <linearGradient id="ergoflow-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37D9C8"/>
      <stop offset="1" stop-color="#12A7D8"/>
    </linearGradient>
    <linearGradient id="ergoflow-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD76A"/>
      <stop offset="1" stop-color="#F5A800"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#061D3B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g transform="translate(26 24)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="172" height="172" rx="42" fill="url(#ergoflow-blue)"/>
    <path d="M45 51 H121" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" opacity="0.98"/>
    <path d="M45 51 V123" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" opacity="0.98"/>
    <path d="M45 87 H105" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.92"/>
    <path d="M49 123 C78 147, 129 145, 149 104" fill="none" stroke="url(#ergoflow-cyan)" stroke-width="18" stroke-linecap="round"/>
    <path d="M137 106 L158 96 L151 119 Z" fill="url(#ergoflow-cyan)"/>
    <circle cx="129" cy="52" r="12" fill="url(#ergoflow-gold)"/>
  </g>

  <g transform="translate(226 58)">
    <text x="0" y="69" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="850" letter-spacing="-3">
      <tspan fill="#082E57">Ergo</tspan><tspan fill="#12A7D8">Flow</tspan>
    </text>
    <path d="M6 94 C70 112, 170 112, 244 94 S367 75, 452 94" fill="none" stroke="url(#ergoflow-cyan)" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
    <text x="8" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1.8" fill="#0A4D78" opacity="0.82">WORK FLOWS BETTER</text>
  </g>
</svg>
