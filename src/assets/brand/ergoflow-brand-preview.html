<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ErgoFlow general logo preview</title>
  <style>
    :root { --navy:#082E57; --cyan:#12A7D8; --bg:#f5f8fb; }
    body { margin:0; font-family: Inter, Segoe UI, Arial, sans-serif; background:var(--bg); color:#0b2038; }
    main { max-width:1080px; margin:0 auto; padding:42px 22px 70px; }
    h1 { margin:0 0 8px; font-size:32px; }
    p { margin:0 0 28px; color:#486177; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:22px; }
    .card { background:white; border:1px solid #dce7f0; border-radius:24px; padding:28px; box-shadow:0 18px 50px rgba(8,46,87,.08); }
    .dark { background:#061D3B; color:white; }
    .checker { background-image: linear-gradient(45deg,#e9f0f6 25%,transparent 25%),linear-gradient(-45deg,#e9f0f6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9f0f6 75%),linear-gradient(-45deg,transparent 75%,#e9f0f6 75%); background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0; }
    img { max-width:100%; height:auto; display:block; }
    .header-demo { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 22px; border-radius:20px; background:white; border:1px solid #dce7f0; }
    .nav { display:flex; gap:18px; color:#60758a; font-weight:700; }
    .smallmark { width:82px; }
  </style>
</head>
<body>
  <main>
    <h1>ErgoFlow — general umbrella logo</h1>
    <p>No craftsman/tool-specific symbol. This is the parent ErgoFlow identity; each app can get its own sub-logo later.</p>
    <section class="card header-demo">
      <img src="ergoflow-logo.svg" alt="ErgoFlow logo" style="width:310px" />
      <div class="nav"><span>Apps</span><span>Platform</span><span>Support</span></div>
    </section>
    <br />
    <section class="grid">
      <div class="card"><h2>Primary logo</h2><img src="ergoflow-logo.svg" alt="Primary ErgoFlow logo" /></div>
      <div class="card"><h2>Square mark</h2><img src="ergoflow-mark.svg" alt="Square ErgoFlow mark" class="smallmark" /></div>
      <div class="card checker"><h2>Transparent check</h2><img src="ergoflow-logo.svg" alt="Transparent background logo" /></div>
      <div class="card dark"><h2>Dark background check</h2><img src="ergoflow-logo.svg" alt="Logo on dark" /></div>
      <div class="card"><h2>Wordmark only</h2><img src="ergoflow-wordmark.svg" alt="ErgoFlow wordmark" /></div>
    </section>
  </main>
</body>
</html>
