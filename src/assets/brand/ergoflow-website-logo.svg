<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">ErgoFlow website logo</title>
  <desc id="desc">A navy and gold ErgoFlow logo for tradesmen CRM, with a tool-and-flow icon and horizontal wordmark.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3A66"/>
      <stop offset="1" stop-color="#061F3D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD34D"/>
      <stop offset="1" stop-color="#F5A800"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#061F3D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(24 24)" filter="url(#softShadow)">
    <rect x="0" y="0" width="172" height="172" rx="38" fill="url(#navy)"/>

    <!-- Flow sweep -->
    <path d="M35 121 C65 146, 118 144, 141 108" fill="none" stroke="url(#gold)" stroke-width="19" stroke-linecap="round"/>
    <path d="M131 109 L150 103 L143 122 Z" fill="#F5A800"/>

    <!-- E / work bars -->
    <rect x="40" y="43" width="82" height="18" rx="9" fill="url(#gold)"/>
    <rect x="40" y="77" width="67" height="18" rx="9" fill="url(#gold)"/>
    <rect x="40" y="111" width="82" height="18" rx="9" fill="url(#gold)"/>
    <rect x="33" y="43" width="19" height="86" rx="9.5" fill="url(#gold)"/>

    <!-- Simple wrench silhouette, kept readable small -->
    <g transform="translate(96 39) rotate(38 35 47)">
      <path d="M56 11 C47 8, 37 10, 30 17 C23 24, 21 34, 24 43 L8 59 C3 64, 3 72, 8 77 C13 82, 21 82, 26 77 L42 61 C51 64, 61 62, 68 55 C75 48, 77 38, 74 29 L62 41 L48 27 Z" fill="#FFFFFF" opacity="0.96"/>
      <circle cx="17" cy="68" r="5" fill="#0B3A66" opacity="0.95"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(226 58)">
    <text x="0" y="68" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2.5">
      <tspan fill="#082E57">Ergo</tspan><tspan fill="#F5A800">Flow</tspan>
    </text>
    <rect x="4" y="88" width="308" height="6" rx="3" fill="#F5A800" opacity="0.95"/>
    <text x="4" y="124" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="0.6" fill="#0B3A66" opacity="0.86">CRM for Craftsmen</text>
  </g>
</svg>
