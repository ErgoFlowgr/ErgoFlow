<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ErgoFlow brand mark</title>
  <desc id="desc">General ErgoFlow square brand mark: an EF monogram with a clean flow curve, suitable for favicon, app tile, and umbrella brand use.</desc>
  <defs>
    <linearGradient id="ergoflow-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A4D78"/>
